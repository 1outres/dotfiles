name: Set up Nix
description: >-
  Install Nix with the attic cache usable as a substituter and the private flake
  inputs fetchable.

inputs:
  private-inputs-pat:
    description: Token that can read the private flake input repositories.
    required: true
  attic-token:
    description: Token for the attic cache.
    required: true
  attic-endpoint:
    description: Base URL of the attic server.
    required: true
  attic-cache:
    description: Name of the cache on that server.
    required: true
  attic-public-key:
    description: Public key the cache signs store paths with.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate private flake inputs
      shell: bash
      env:
        PAT: ${{ inputs.private-inputs-pat }}
      run: |
        git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf ssh://git@github.com/
        for repo in dotfiles-private window-tracker; do
          git ls-remote "ssh://git@github.com/1outres/$repo.git" HEAD >/dev/null \
            || { echo "PRIVATE_INPUTS_PAT cannot read 1outres/$repo"; exit 1; }
        done

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          accept-flake-config = true
          experimental-features = nix-command flakes
          extra-substituters = ${{ inputs.attic-endpoint }}/${{ inputs.attic-cache }}
          extra-trusted-public-keys = ${{ inputs.attic-public-key }}

    # Substituting is done by the daemon, which runs as root, so a token under
    # $HOME never reaches it and every path misses with HTTP 401.
    #
    # It has to be this exact path. Determinate's nix.conf sets netrc-file after
    # including the nix.custom.conf that carries the installer's extra-conf, so
    # extra-conf loses; appending to nix.conf loses too, because the daemon
    # rewrites that file when it restarts. `nix config show` as root confirms
    # the daemon resolves netrc-file to this path no matter what we set.
    - name: Give the daemon the cache token
      shell: bash
      env:
        ATTIC_ENDPOINT: ${{ inputs.attic-endpoint }}
        ATTIC_CACHE: ${{ inputs.attic-cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: |
        set -euo pipefail
        netrc=/nix/var/determinate/netrc
        host=${ATTIC_ENDPOINT#*://}
        sudo mkdir -p "$(dirname "$netrc")"
        printf 'machine %s password %s\n' "${host%%/*}" "$ATTIC_TOKEN" \
          | sudo tee "$netrc" >/dev/null
        sudo chmod 600 "$netrc"

        # The daemon parses the netrc when it starts. Service names come from
        # nix-installer's configure_determinate_nixd_init_service.
        case "$RUNNER_OS" in
          Linux) sudo systemctl restart nix-daemon.service ;;
          macOS) sudo launchctl kickstart -k system/systems.determinate.nix-daemon ;;
        esac
        nix store info --store daemon >/dev/null

        echo "netrc-file as the daemon resolves it:"
        sudo "$(command -v nix)" config show netrc-file
        echo "curl with that file answers:"
        sudo curl -sS -o /dev/null -w '%{http_code}\n' \
          --netrc-file "$netrc" "$ATTIC_ENDPOINT/$ATTIC_CACHE/nix-cache-info"

    - name: Install the attic client
      shell: bash
      run: nix profile install nixpkgs#attic-client
