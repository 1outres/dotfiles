name: Set up Nix
description: >-
  Install Nix with the attic cache usable as a substituter and the private flake
  inputs fetchable.

inputs:
  private-inputs-pat:
    description: Token that can read the private flake input repositories.
    required: true
  attic-token:
    description: Token for the attic cache.
    required: true
  attic-endpoint:
    description: Base URL of the attic server.
    required: true
  attic-cache:
    description: Name of the cache on that server.
    required: true
  attic-public-key:
    description: Public key the cache is expected to sign store paths with.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate private flake inputs
      shell: bash
      env:
        PAT: ${{ inputs.private-inputs-pat }}
      run: |
        git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf ssh://git@github.com/
        for repo in dotfiles-private window-tracker; do
          git ls-remote "ssh://git@github.com/1outres/$repo.git" HEAD >/dev/null \
            || { echo "PRIVATE_INPUTS_PAT cannot read 1outres/$repo"; exit 1; }
        done

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          accept-flake-config = true
          experimental-features = nix-command flakes

    - name: Install the attic client
      shell: bash
      run: nix profile install nixpkgs#attic-client

    # `attic use` is what writes the substituter, its public key and the token
    # into nix.conf. Writing a netrc by hand and passing netrc-file through the
    # installer did not reach the daemon: every path missed with HTTP 401 and
    # the whole closure was built from source.
    - name: Point nix at the attic cache
      shell: bash
      env:
        ATTIC_ENDPOINT: ${{ inputs.attic-endpoint }}
        ATTIC_CACHE: ${{ inputs.attic-cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
        ATTIC_PUBLIC_KEY: ${{ inputs.attic-public-key }}
      run: |
        set -euo pipefail
        attic login loutres "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
        attic use "loutres:$ATTIC_CACHE"

        # Stop here rather than spend an hour rebuilding what the cache already
        # holds. The key check also catches the server handing back a new one.
        nix config show substituters | grep -q "$ATTIC_ENDPOINT" \
          || { echo "attic is not registered as a substituter"; exit 1; }
        nix config show trusted-public-keys | grep -q "$ATTIC_PUBLIC_KEY" \
          || { echo "attic returned a public key we do not expect"; exit 1; }
