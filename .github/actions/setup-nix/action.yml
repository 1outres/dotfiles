name: Set up Nix
description: >-
  Install Nix with the private flake inputs fetchable.

inputs:
  private-inputs-pat:
    description: Token that can read the private flake input repositories.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate private flake inputs
      shell: bash
      env:
        PAT: ${{ inputs.private-inputs-pat }}
      run: |
        git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf ssh://git@github.com/
        git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf https://github.com/
        for repo in dotfiles-private; do
          git ls-remote "ssh://git@github.com/1outres/$repo.git" HEAD >/dev/null \
            || { echo "PRIVATE_INPUTS_PAT cannot read 1outres/$repo"; exit 1; }
        done

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        # Upstream Nix, as on the hosts. We do not use FlakeHub, which is what
        # Determinate buys here.
        determinate: false
        extra-conf: |
          accept-flake-config = true
          experimental-features = nix-command flakes
          # The hosts get these keys from modules/shared/nix.nix and, on
          # nixbook, from the Aurora module, but a runner never applies those
          # modules. The flake adds all three caches as substituters, so
          # without the keys here Nix fetches from them and then drops every
          # path as unsigned, building the lot from source.
          # trusted-public-keys is a restricted setting, so the flake cannot
          # carry the keys itself.
          extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
