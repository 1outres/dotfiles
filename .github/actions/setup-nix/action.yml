name: Set up Nix
description: >-
  Install Nix with the attic cache usable as a substituter and the private flake
  inputs fetchable.

inputs:
  private-inputs-pat:
    description: Token that can read the private flake input repositories.
    required: true
  attic-token:
    description: Token for the attic cache.
    required: true
  attic-endpoint:
    description: Base URL of the attic server.
    required: true
  attic-cache:
    description: Name of the cache on that server.
    required: true
  attic-public-key:
    description: Public key the cache signs store paths with.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate private flake inputs
      shell: bash
      env:
        PAT: ${{ inputs.private-inputs-pat }}
      run: |
        git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf ssh://git@github.com/
        for repo in dotfiles-private window-tracker; do
          git ls-remote "ssh://git@github.com/1outres/$repo.git" HEAD >/dev/null \
            || { echo "PRIVATE_INPUTS_PAT cannot read 1outres/$repo"; exit 1; }
        done

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          accept-flake-config = true
          experimental-features = nix-command flakes
          extra-substituters = ${{ inputs.attic-endpoint }}/${{ inputs.attic-cache }}
          extra-trusted-public-keys = ${{ inputs.attic-public-key }}
          netrc-file = /etc/nix/netrc

    # Substituting is done by the daemon, which runs as root, so a token under
    # $HOME only ever reaches the client and every path misses with HTTP 401.
    # The file has to be written after the installer runs: it lays out /etc/nix
    # itself and does not keep a netrc put there beforehand.
    - name: Give the daemon the cache token
      shell: bash
      env:
        ATTIC_ENDPOINT: ${{ inputs.attic-endpoint }}
        ATTIC_CACHE: ${{ inputs.attic-cache }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: |
        set -euo pipefail
        host=${ATTIC_ENDPOINT#*://}
        printf 'machine %s password %s\n' "${host%%/*}" "$ATTIC_TOKEN" \
          | sudo tee /etc/nix/netrc >/dev/null
        sudo chmod 600 /etc/nix/netrc

        # The daemon parses the netrc once at startup, so the file above stays
        # invisible to it until it is restarted. Service names come from
        # nix-installer's configure_determinate_nixd_init_service.
        case "$RUNNER_OS" in
          Linux) sudo systemctl restart nix-daemon.service ;;
          macOS) sudo launchctl kickstart -k system/systems.determinate.nix-daemon ;;
        esac

        # Stop here rather than spend an hour rebuilding what the cache holds.
        nix store info --store daemon >/dev/null
        code=$(sudo curl -sS -o /dev/null -w '%{http_code}' \
          --netrc-file /etc/nix/netrc "$ATTIC_ENDPOINT/$ATTIC_CACHE/nix-cache-info")
        [ "$code" = 200 ] || { echo "the cache answered $code for the daemon token"; exit 1; }

    # Temporary: show what the daemon actually reads. A netrc it can use through
    # curl still comes back 401 through nix, so the config it sees must differ.
    - name: Diagnose the daemon configuration
      shell: bash
      run: |
        set -uo pipefail
        echo "--- /etc/nix contents ---"
        sudo ls -la /etc/nix/
        echo "--- /etc/nix/nix.conf ---"
        sudo cat /etc/nix/nix.conf
        echo "--- /etc/nix/nix.custom.conf ---"
        sudo cat /etc/nix/nix.custom.conf
        echo "--- config as root sees it ---"
        sudo nix config show | grep -iE "netrc|substituters|trusted"

    - name: Install the attic client
      shell: bash
      run: nix profile install nixpkgs#attic-client
